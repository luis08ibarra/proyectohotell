<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Reservas - Hotel L&E</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="../Css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold text-warning"
               href="../index.html">
                Hotel L&E
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="habitaciones.html">
                            Habitaciones
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="reservas.html">
                            Reservar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="clima.html">
                            Clima Local
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="administracion.html">
                            Gestión
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- CONTENIDO -->
    <main class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold mb-1">
                    Gestión de Reservas
                </h2>

                <p class="text-muted mb-0">
                    Consulta y administra las reservas del hotel.
                </p>
            </div>

            <button class="btn btn-dark"
                    id="btnToggleDark">
                🌙 Modo Dark
            </button>

        </div>


        <!-- TABLA -->
        <div class="card border-0 shadow-sm">

            <div class="card-header bg-warning text-dark">
                <h5 class="fw-bold mb-0">
                    Reservas registradas
                </h5>
            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Habitación</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Huéspedes</th>
                            <th>Acción</th>
                        </tr>

                    </thead>

                    <tbody id="tablaReservas">

                    </tbody>

                </table>

            </div>
        </div>

    </main>

    <footer class="bg-black text-secondary text-center py-4">

        <p class="mb-0">
            🏨 Hotel L&E Resort © 2026
        </p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/app.js"></script>

</body>
</html>
